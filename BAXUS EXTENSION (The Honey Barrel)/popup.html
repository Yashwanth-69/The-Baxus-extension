<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Match</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cal+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Color system */
      --color-primary: #FFD700;
      --color-primary-dark: #E6C200;
      --color-secondary: #34C759;
      --color-accent: #FFD700;
      --color-accent-dark: #E6C200;
      --color-error: #FF3B30;
      --color-warning: #FF9500;
      --color-background: #F5D000;
      --color-surface: #FFE55C;
      --color-text-primary: #2C2810;
      --color-text-secondary: #3D3415;
      --color-text-tertiary: #4A4019;
      --color-border: #E6C200;
      
      /* Spacing system (8px) - slightly reduced */
      --space-1: 3px;
      --space-2: 6px;
      --space-3: 12px;
      --space-4: 18px;
      --space-5: 24px;
      
      /* Animation */
      --transition-fast: 150ms ease;
      --transition-normal: 250ms ease;
      --transition-slow: 350ms ease;
      
      /* Elevation */
      --shadow-sm: 0 1px 2px rgba(255, 215, 0, 0.2);
      --shadow-md: 0 3px 5px rgba(255, 215, 0, 0.25), 0 1px 2px rgba(255, 215, 0, 0.2);
      --shadow-lg: 0 8px 12px rgba(255, 215, 0, 0.3), 0 3px 5px rgba(255, 215, 0, 0.2);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Cal Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--color-background);
      color: var(--color-text-primary);
      line-height: 1.5;
      padding: var(--space-3);
      width: 400px;
      height: 600px;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: 12px;
    }
    
    h2 {
      font-family: 'Cal Sans', sans-serif;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: var(--space-1);
      color: var(--color-text-primary);
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
    }
    
    h3 {
      font-size: 14px;
      font-weight: 500;
      margin-bottom: var(--space-1);
      color: var(--color-text-secondary);
    }
    
    p {
      margin-bottom: var(--space-1);
      color: var(--color-text-secondary);
      font-size: 12px;
    }
    
    img {
      max-width: 100%;
      height: auto;
      border-radius: var(--space-1);
    }
    
    .container {
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
    }
    
    .logo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: var(--space-2);
      padding: var(--space-3);
      border-radius: var(--space-1);
      background: var(--color-surface);
      border: 2px solid var(--color-accent);
      box-shadow: var(--shadow-md);
      transition: transform var(--transition-normal);
    }
    
    .logo-container:hover {
      transform: scale(1.02);
    }
    
    .logo-container img {
      height: 50px;
      width: auto;
      object-fit: cover;
    }
    
    .product-card {
      background: var(--color-surface);
      border-radius: var(--space-1);
      padding: var(--space-4);
      margin-bottom: var(--space-2);
      box-shadow: var(--shadow-md);
      border: 2px solid var(--color-border);
      animation: fadeIn 0.3s ease-in-out;
    }
    
    .product-info {
      margin-bottom: var(--space-2);
    }
    
    .product-info p {
      display: flex;
      justify-content: space-between;
      border-bottom: 2px solid var(--color-border);
      padding-bottom: var(--space-1);
      margin-bottom: var(--space-1);
      font-size: 14px;
    }
    
    .product-info span {
      font-weight: 500;
      color: var(--color-text-primary);
      font-size: 16px;
    }
    
    .product-image-container {
      margin-top: var(--space-3);
      border-radius: var(--space-1);
      overflow: hidden;
      box-shadow: var(--shadow-md);
    }
    
    .product-image-container img {
      width: 100%;
      height: auto;
      transition: transform var(--transition-normal);
    }
    
    .product-image-container img:hover {
      transform: scale(1.03);
    }
    
    .discount-badge {
      display: block;
      background-color: var(--color-secondary);
      color: white;
      font-weight: 600;
      font-size: 14px;
      padding: var(--space-1) var(--space-3);
      border-radius: 16px;
      margin: var(--space-2) auto;
      box-shadow: var(--shadow-sm);
      letter-spacing: 0.5px;
      text-align: center;
      width: fit-content;
    }
    
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--space-4);
      animation: fadeIn 0.3s ease-in-out;
      background: var(--color-surface);
      border-radius: var(--space-1);
      box-shadow: var(--shadow-md);
      border: 2px solid var(--color-border);
    }
    
    .empty-state img {
      width: 50px;
      height: 50px;
      margin-bottom: var(--space-2);
      opacity: 0.7;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.2));
    }
    
    .button {
      width: 100%;
      padding: var(--space-2) var(--space-3);
      border-radius: var(--space-1);
      font-family: 'Cal Sans', sans-serif;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
      border: 2px solid #B8860B;
      background-color: #F4C430;
      color: #000000;
      margin-bottom: var(--space-3);
    }
    
    .button-primary {
      background-color: #F4C430;
      color: #000000;
      box-shadow: var(--shadow-sm);
    }
    
    .button-primary:hover {
      background-color: #EDB828;
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }
    
    .button-primary:active {
      transform: translateY(0);
      box-shadow: var(--shadow-sm);
    }
    
    .button-secondary {
      background-color: #F4C430;
      color: #000000;
      border: 2px solid #B8860B;
    }
    
    .button-secondary:hover {
      background-color: #EDB828;
      color: #000000;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(var(--space-1));
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 215, 0, 0.4);
      }
      70% {
        box-shadow: 0 0 0 4px rgba(255, 215, 0, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 215, 0, 0);
      }
    }
    
    .pulse-animation {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="matchFound" style="display: none;">
      <div class="logo-container pulse-animation">
        <img src="https://mms.businesswire.com/media/20240501513935/en/2115090/22/BAXUS.jpg" alt="Baxus Logo">
      </div>
      
      <div class="product-card">
        <h2 id="productName"></h2>
        
        <div class="product-info">
          <p>Type: <span id="productType"></span></p>
          <p>Price: <span id="productPrice"></span></p>
        </div>
        
        <p id="productDiscount" class="discount-badge"></p>
        <button id="viewButton" class="button button-primary">View Product</button>
        
        <div class="product-image-container">
          <img id="productImage" src="" alt="Product Image" />
        </div>
      </div>
    </div>

    <div id="noMatch" class="empty-state">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR66HEajJJlHGoBcLrUxvYjczp7dU9HRtocHA&s" alt="No Match Icon">
      <h3>No Match Found</h3>
      <p>We couldn't find a matching product at this time.</p>
      <button id="retryButton" class="button button-secondary">Try Again</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
